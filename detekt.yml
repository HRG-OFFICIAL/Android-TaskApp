style:
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
  WildcardImport:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 160

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false

complexity:
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 6

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  IgnoredReturnValue:
    active: true

performance:
  SpreadOperator:
    active: true